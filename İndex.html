<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>multiplayersystemTORM - Live Dashboard</title>
    <link rel="stylesheet" href="3.css">
</head>
<body>
    <div class="torm-container">
        <h1>multiplayersystemTORM Dashboard</h1>
        <p>Status: <span id="status" class="status-badge">Connecting...</span></p>
        <div id="log-box" style="background: #090d12; padding: 10px; margin-top: 15px; border-radius: 4px; height: 150px; overflow-y: auto;"></div>
    </div>
    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        const statusEl = document.getElementById('status');
        const logBox = document.getElementById('log-box');

        socket.on('connect', () => {
            statusEl.textContent = 'ONLINE (Connected)';
            statusEl.style.color = '#2ea043';
        });

        socket.on('disconnect', () => {
            statusEl.textContent = 'OFFLINE (Disconnected)';
            statusEl.style.color = '#f85149';
        });

        socket.on('sync_player', (data) => {
            logBox.innerHTML += `<div>[SYNC] Player ${data.id} updated position.</div>`;
            logBox.scrollTop = logBox.scrollHeight;
        });
    </script>
</body>
</html>
